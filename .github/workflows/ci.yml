name: CI

# Runs the offline test suite on every push to main and every PR.
#
# The suite in tests/ is fully offline by design: it generates a throwaway RSA
# key (tests/conftest.py) and never touches the network or needs real Kalshi
# credentials. So there is nothing to mark, skip, or provide secrets for here --
# a plain `pytest` run is the whole story. If a future test needs the live API
# or credentials, gate it behind a marker (e.g. @pytest.mark.live) and add
# `-m "not live"` below rather than wiring secrets into CI.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run offline test suite
        run: pytest -q
